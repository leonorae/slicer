[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geometric-viz"
version = "0.1.0"
description = "Geometric Visualization Pipeline for transformer latent spaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML / model loading
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",       # required for device_map='auto' on multi-GPU
    # Dimensionality reduction
    "scikit-learn>=1.3.0",
    "umap-learn>=0.5.4",        # also installs numba, pynndescent
    # Numerics & plotting
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
microscope = [
    "open-clip-torch>=2.24.0",  # CLIP embedding extraction
    "diffusers>=0.25.0",        # Stable Diffusion pipeline
    "Pillow>=10.0.0",           # image grid composition
    "lpips>=0.1.4",             # perceptual similarity (optional analysis)
    "datasets>=2.14.0",         # HuggingFace datasets (training corpus loader)
    "nltk>=3.8.0",              # WordNet definitions (training corpus loader)
]

[project.scripts]
geometric-viz = "run_pipeline:main"
diffusion-microscope = "run_microscope:main"

[tool.uv]
# GPU wheels: override the torch index when installing on CUDA machines.
# Example: uv sync --extra-index-url https://download.pytorch.org/whl/cu121
